<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4th ESO English Syllabus Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Drawer transitions */
        .drawer-overlay {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease-in-out;
        }
        .drawer-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .drawer-panel {
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .drawer-panel.show {
            transform: translateX(0);
        }

        /* Glassmorphism */
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .dark .glass-card {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-200 transition-colors duration-300 relative font-sans antialiased min-h-screen">

    <div id="app">
        <!-- Content injected by JS -->
    </div>

    <script>
        // Data Store
        const units = [
            {
                id: 1,
                title: "Warm Up & Back to School",
                shortTitle: "Warm Up",
                theme: "amber",
                gradient: "from-amber-400 to-orange-500",
                icon: "book",
                grammar: "Basic review (Past tenses, present simple)",
                vocab: [
                    { term: "passport", def: "passaport", example: "We use the English passport to track our progress." },
                    { term: "expectations", def: "expectatives", example: "What are your expectations for this year?" },
                    { term: "goals", def: "objectius", example: "Set some goals to improve your fluency." }
                ],
                student: {

                    products: [
                        { type: "Written Task", desc: "A Summer Memory Writing: attach a picture from your holidays and write about it." },
                        { type: "English Passport", desc: "Mark in the passport where you think your knowledge is located." }
                    ]
                },
                teacher: {
                    repte: "Establish classroom routines, set expectations, and conduct initial diagnostic assessments.",
                    competencies: "Competència Específica 1 (Oral reception) and 3 (Oral production).",
                    methodology: "Ice-breakers, diagnostic testing, collaborative goal setting.",
                    assessment: "Diagnostic, non-graded feedback to gauge initial level."
                }
            },
            {
                id: 2,
                title: "Personality, Advertising and Shopping",
                shortTitle: "Personality & Ads",
                theme: "rose",
                gradient: "from-rose-400 to-pink-500",
                icon: "shopping-bag",
                grammar: "Past Simple, Past Continuous, Used to, Past Perfect",
                vocab: [
                    { term: "personality", def: "personalitat", example: "She has a very outgoing personality." },
                    { term: "advertising", def: "publicitat", example: "Advertising influences what we buy." },
                    { term: "shopping", def: "compres", example: "Online shopping is very popular." },
                    { term: "influencer", def: "creador de tendències", example: "The influencer promoted a new brand." },
                    { term: "customer review", def: "ressenya de client", example: "Read the customer review before buying." }
                ],
                student: {
                    repte: "Explore how advertising affects us and learn to describe personalities and shopping habits.",
                    products: [
                        { type: "Written Task", desc: "Write a Customer Review evaluating a product or service." },
                        { type: "Reading Task", desc: "Read 'The Rise of the Influencer' and answer the questions." },
                        { type: "TOD & Speaking", desc: "Complete the Grammar review stations and discuss short spooky films." }
                    ]
                },
                teacher: {
                    repte: "Develop critical thinking regarding media and consumerism, while consolidating narrative past tenses.",
                    competencies: "Competència Específica 2 (Written reception) and 5 (Written production).",
                    methodology: "Station-based learning (TOD), critical reading, peer editing.",
                    assessment: "Accuracy of narrative tenses in the review, reading comprehension."
                }
            },
            {
                id: 3,
                title: "Nutrition, Well-Being, Aches and Pains",
                shortTitle: "Health",
                theme: "emerald",
                gradient: "from-emerald-400 to-teal-500",

                    { term: "well-being", def: "benestar", example: "Focus on your mental well-being." },
                    { term: "aches", def: "malestars", example: "He has aches after playing sports." },
                    { term: "pains", def: "dolors", example: "She felt pains in her stomach." },
                    { term: "diet", def: "dieta", example: "A balanced diet is very important." }
                ],
                student: {

                    products: [
                        { type: "Written Task", desc: "Write an Opinion Essay about health and lifestyle." },
                        { type: "TOD 2", desc: "Design a weekly meal plan focusing on nutrition and wellbeing." },
                        { type: "Speaking Game", desc: "Play Boom!! / 1, 2, 3... Speak! to practice fluency." }
                    ]
                },
                teacher: {

                    competencies: "Personal, social i d’aprendre a aprendre (CPSAA 5), Llengua Estrangera 5.",
                    methodology: "Gamification (Boom!), project-based learning (meal plan), essay structuring.",
                    assessment: "Cohesion in opinion essays, oral fluency during games, proper use of modals."

            },
            {
                id: 4,
                title: "News, Utopia, Education and Careers",
                shortTitle: "News & Future",
                theme: "blue",
                gradient: "from-blue-400 to-indigo-500",
                icon: "globe",
                grammar: "Future Tenses",
                vocab: [
                    { term: "news", def: "notícies", example: "Did you watch the news today?" },
                    { term: "utopia", def: "utopia", example: "An ideal society is a utopia." },
                    { term: "senses", def: "sentits", example: "We have five basic senses." },
                    { term: "education", def: "educació", example: "Education is the key to success." },
                    { term: "careers", def: "carreres professionals", example: "They discussed their future careers." }
                ],
                student: {
                    repte: "Analyze current events, envision ideal societies, and plan your future education and career.",
                    products: [
                        { type: "Written Task", desc: "Write a Report Practice based on a questionnaire." },
                        { type: "Listening Task", desc: "Complete the Unit 3 Listening Test and practice." },
                        { type: "TOD 3", desc: "Choose a Youtube video (challenge, tag, unboxing) and analyze it." }
                    ]
                },
                teacher: {
                    repte: "Students explore societal issues and future educational trajectories, developing vocabulary to express hypotheses.",
                    competencies: "Ciutadana (CC1), Llengua Estrangera 3 (Oral) and 5 (Written).",
                    methodology: "Inquiry-based learning, media literacy (YouTube analysis), formal report writing.",
                    assessment: "Ability to extract main ideas from audio, formal register in reports."
                }
            },
            {
                id: 5,
                title: "Protest, Reporting and Entertainment",
                shortTitle: "Protest & Media",
                theme: "purple",
                gradient: "from-purple-400 to-violet-500",
                icon: "megaphone",
                grammar: "Conditionals",
                vocab: [
                    { term: "protest", def: "protesta", example: "The protest was peaceful." },
                    { term: "reporting", def: "reportatge", example: "Journalists are reporting live." },
                    { term: "entertainment", def: "entreteniment", example: "Movies are a form of entertainment." },
                    { term: "social media", def: "xarxes socials", example: "Social media connects people." }
                ],
                student: {
                    repte: "Understand the power of reporting and protests, and explore the entertainment industry.",
                    products: [
                        { type: "Listening Task", desc: "Listen to the opening scene of 'The Lord of the Rings' and fill in the gaps." },
                        { type: "TOD 4", desc: "Complete the Conditionals Learning Stations." },
                        { type: "Reading Task", desc: "Complete the Comp. Bàsiques Practice." }
                    ]
                },
                teacher: {
                    repte: "Develop critical awareness of media and civic action, utilizing complex conditional structures.",
                    competencies: "Ciutadana (CC2), Llengua Estrangera 2 & 4.",
                    methodology: "Station-based learning (Conditionals), multimedia listening, standardized test practice.",
                    assessment: "Accurate use of conditionals, listening comprehension of authentic materials."
                }
            },
            {
                id: 6,
                title: "Final Evaluations and Presentations",
                shortTitle: "Finals",
                theme: "slate",
                gradient: "from-slate-700 to-slate-900",
                icon: "award",
                grammar: "Comprehensive Review",
                vocab: [
                    { term: "presentation", def: "presentació", example: "She gave a great presentation." },
                    { term: "fluency", def: "fluïdesa", example: "Practice speaking to improve your fluency." },
                    { term: "accuracy", def: "precisió", example: "Check your grammar for accuracy." },
                    { term: "comprehension", def: "comprensió", example: "The test measures reading comprehension." }
                ],
                student: {
                    repte: "Show everything you've learned this year! Prepare for your final exams and your oral presentation.",
                    products: [
                        { type: "Oral Task", desc: "A One minute talk that counts as 10% of the final mark." },
                        { type: "Proves Finals", desc: "Complete the Final Oral Comprehension and Reading Comprehension exams." }
                    ]
                },
                teacher: {
                    repte: "Consolidate the year's learning and conduct final summative assessments across all skills.",
                    competencies: "All Competències Específiques.",
                    methodology: "Summative assessment, oral presentations, standardized testing.",
                    assessment: "Final mastery of 4th ESO objectives, oral fluency, reading and listening comprehension."
                }
            }
        ];

        const themeClasses = {
            amber: { bg: 'bg-amber-100 dark:bg-amber-900/40', text: 'text-amber-700 dark:text-amber-400' },
            blue: { bg: 'bg-blue-100 dark:bg-blue-900/40', text: 'text-blue-700 dark:text-blue-400' },
            emerald: { bg: 'bg-emerald-100 dark:bg-emerald-900/40', text: 'text-emerald-700 dark:text-emerald-400' },
            rose: { bg: 'bg-rose-100 dark:bg-rose-900/40', text: 'text-rose-700 dark:text-rose-400' },
            purple: { bg: 'bg-purple-100 dark:bg-purple-900/40', text: 'text-purple-700 dark:text-purple-400' },
            slate: { bg: 'bg-slate-200 dark:bg-slate-800', text: 'text-slate-700 dark:text-slate-300' }
        };

        // State
        let currentView = 'student'; // 'student' | 'teacher'
        let isDarkMode = false;
        let searchQuery = '';
        let selectedUnit = null;
        let activeTab = 'glance'; // 'glance' | 'toolkit' | 'assess'

        // Initialization
        function initApp() {
            const app = document.getElementById('app');
            app.innerHTML = `
                <nav class="sticky top-0 z-30 bg-white/70 dark:bg-slate-950/70 backdrop-blur-xl border-b border-slate-200 dark:border-slate-800">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white shadow-lg shadow-blue-500/20">
                                <i data-lucide="graduation-cap"></i>
                            </div>
                            <h1 class="font-bold text-xl tracking-tight hidden sm:block">4th ESO English</h1>
                        </div>
                        
                        <div class="flex items-center gap-4 sm:gap-6">
                            <div class="flex bg-slate-100 dark:bg-slate-900 p-1 rounded-full relative shadow-inner border border-slate-200 dark:border-slate-800">
                                <div id="togglePill" class="absolute top-1 bottom-1 w-[calc(50%-4px)] bg-white dark:bg-slate-800 rounded-full shadow transition-all duration-300 left-1 border border-slate-200 dark:border-slate-700"></div>
                                <button id="btnStudent" onclick="setView('student')" class="relative z-10 px-3 sm:px-4 py-1.5 text-xs sm:text-sm font-medium rounded-full transition-colors text-blue-600 dark:text-blue-400">Student</button>
                                <button id="btnTeacher" onclick="setView('teacher')" class="relative z-10 px-3 sm:px-4 py-1.5 text-xs sm:text-sm font-medium rounded-full transition-colors text-slate-500 dark:text-slate-400">Teacher</button>
                            </div>
                            
                            <button id="themeIconBtn" onclick="toggleTheme()" class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors text-slate-500 dark:text-slate-400">
                                <i data-lucide="moon"></i>
                            </button>
                        </div>
                    </div>
                </nav>

                <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8 space-y-12 pb-20">
                    <section id="roadmapSection"></section>
                    
                    <section class="flex flex-col md:flex-row justify-between items-center gap-4">
                        <div class="relative w-full md:w-[28rem] group">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i data-lucide="search" class="h-5 w-5 text-slate-400 group-focus-within:text-blue-500 transition-colors"></i>
                            </div>
                            <input type="text" id="searchInput" placeholder="Search topics, grammar, vocabulary..." 
                                class="block w-full pl-11 pr-4 py-3 border border-slate-200 dark:border-slate-800 rounded-2xl leading-5 bg-white dark:bg-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm transition-all shadow-sm">
                        </div>
                    </section>

                    <section id="gridSection"></section>
                    <section id="resourceSection"></section>
                </main>

                <div id="drawerOverlay" onclick="closeDrawer()" class="drawer-overlay fixed inset-0 bg-slate-900/40 dark:bg-slate-950/70 backdrop-blur-sm z-40"></div>
                <div id="drawerPanel" class="drawer-panel fixed inset-y-0 right-0 w-full sm:w-[500px] md:w-[600px] bg-slate-50 dark:bg-slate-950 shadow-2xl z-50 flex flex-col border-l border-slate-200 dark:border-slate-800">
                    <div id="drawerContent" class="flex-col h-full hidden"></div>
                </div>
            `;

            document.getElementById('searchInput').addEventListener('input', (e) => {
                searchQuery = e.target.value;
                renderGrid();
            });

            // Check system theme preference
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                isDarkMode = true;
                document.documentElement.classList.add('dark');
            }

            updateToggleUI();
            renderRoadmap();
            renderGrid();
            renderResourceCorner();
            lucide.createIcons();
        }

        // Core Functions
        function setView(view) {
            if (currentView === view) return;
            currentView = view;
            updateToggleUI();
            renderGrid();
            renderResourceCorner();
            if (selectedUnit) {
                renderDrawerContent();
            }
        }

        function updateToggleUI() {
            const pill = document.getElementById('togglePill');
            const btnStudent = document.getElementById('btnStudent');
            const btnTeacher = document.getElementById('btnTeacher');
            
            if (currentView === 'student') {
                pill.classList.remove('left-[calc(50%+2px)]');
                pill.classList.add('left-1');
                btnStudent.classList.add('text-blue-600', 'dark:text-blue-400');
                btnStudent.classList.remove('text-slate-500', 'dark:text-slate-400');
                btnTeacher.classList.remove('text-blue-600', 'dark:text-blue-400');
                btnTeacher.classList.add('text-slate-500', 'dark:text-slate-400');
            } else {
                pill.classList.remove('left-1');
                pill.classList.add('left-[calc(50%+2px)]');
                btnTeacher.classList.add('text-blue-600', 'dark:text-blue-400');
                btnTeacher.classList.remove('text-slate-500', 'dark:text-slate-400');
                btnStudent.classList.remove('text-blue-600', 'dark:text-blue-400');
                btnStudent.classList.add('text-slate-500', 'dark:text-slate-400');
            }
            
            // Also update theme icon just to be sure
            const themeIconContainer = document.getElementById('themeIconBtn');
            themeIconContainer.innerHTML = `<i data-lucide="${isDarkMode ? 'sun' : 'moon'}"></i>`;
            lucide.createIcons();
        }

        function toggleTheme() {
            isDarkMode = !isDarkMode;
            document.documentElement.classList.toggle('dark', isDarkMode);
            updateToggleUI();
        }

        // Component Renderers
        function renderRoadmap() {
            const roadmap = document.getElementById('roadmapSection');
            roadmap.innerHTML = `
                <div class="flex items-center justify-between mb-8">
                    <h2 class="text-2xl font-bold flex items-center gap-2">
                        <i data-lucide="route" class="text-indigo-500"></i>
                        The Spiral Journey
                    </h2>
                </div>
                <div class="relative py-8 overflow-x-auto no-scrollbar">
                    <div class="absolute top-1/2 left-8 right-8 h-1 bg-slate-200 dark:bg-slate-800 -translate-y-1/2 z-0 rounded-full"></div>
                    <div class="flex justify-between items-center relative z-10 min-w-[800px] px-8">
                        ${units.map((u, i) => {
                            return `
                            <div class="group relative flex flex-col items-center cursor-pointer" onclick="openDrawer(${u.id})">
                                <div class="w-12 h-12 rounded-2xl bg-gradient-to-br ${u.gradient} text-white flex items-center justify-center shadow-lg ring-4 ring-slate-50 dark:ring-slate-950 group-hover:scale-110 group-hover:-translate-y-1 transition-all duration-300">
                                    <span class="font-bold text-lg">${u.id}</span>
                                </div>
                                <div class="absolute top-16 w-32 text-center">
                                    <p class="text-sm font-semibold text-slate-700 dark:text-slate-300 leading-tight group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors">${u.shortTitle}</p>
                                </div>
                                
                                <!-- Tooltip -->
                                <div class="absolute -top-16 opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none bg-slate-800 dark:bg-slate-700 text-white text-xs rounded-lg py-1.5 px-3 whitespace-nowrap z-20 shadow-xl">
                                    ${i > 0 ? `Recycles Unit ${u.id-1}` : 'Starting Point'}
                                    <div class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-2 h-2 bg-slate-800 dark:bg-slate-700 rotate-45"></div>
                                </div>
                            </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function renderGrid() {
            const grid = document.getElementById('gridSection');
            const filteredUnits = units.filter(u => {
                const query = searchQuery.toLowerCase();
                return u.title.toLowerCase().includes(query) || 
                       u.grammar.toLowerCase().includes(query) ||
                       u.vocab.some(v => v.term.toLowerCase().includes(query));
            });

            if (filteredUnits.length === 0) {
                grid.innerHTML = `
                    <div class="text-center py-16 bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800">
                        <i data-lucide="search-x" class="w-12 h-12 text-slate-300 dark:text-slate-600 mx-auto mb-4"></i>
                        <h3 class="text-lg font-medium text-slate-900 dark:text-slate-100">No units found</h3>
                        <p class="text-slate-500 dark:text-slate-400 mt-1">Try adjusting your search keywords.</p>
                    </div>`;
                lucide.createIcons();
                return;
            }

            grid.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    ${filteredUnits.map(u => {
                        const colors = themeClasses[u.theme];
                        const viewData = currentView === 'student' ? u.student : u.teacher;
                        
                        return `
                        <div class="glass-card rounded-3xl p-6 cursor-pointer transform hover:-translate-y-1 hover:shadow-xl transition-all duration-300 relative overflow-hidden group border border-slate-200 dark:border-slate-800 bg-white/70 dark:bg-slate-900/80" onclick="openDrawer(${u.id})">
                            <div class="absolute -right-6 -top-6 w-32 h-32 rounded-full bg-gradient-to-br ${u.gradient} opacity-10 group-hover:opacity-20 transition-opacity blur-2xl"></div>
                            
                            <div class="flex items-center gap-4 mb-5 relative z-10">
                                <div class="w-12 h-12 rounded-2xl bg-gradient-to-br ${u.gradient} text-white flex items-center justify-center shadow-md">
                                    <i data-lucide="${u.icon}"></i>
                                </div>
                                <div class="flex-1">
                                    <p class="text-xs font-bold tracking-wider uppercase text-slate-500 dark:text-slate-400 mb-1">Unit ${u.id}</p>
                                    <h3 class="text-lg font-bold leading-tight text-slate-900 dark:text-white group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors">${u.title}</h3>
                                </div>
                            </div>
                            
                            <div class="space-y-4 relative z-10">
                                <div class="bg-slate-50/50 dark:bg-slate-950/50 rounded-xl p-3 border border-slate-100 dark:border-slate-800">
                                    <p class="text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1 flex items-center gap-1.5">
                                        <i data-lucide="target" class="w-3.5 h-3.5"></i> ${currentView === 'student' ? 'Your Challenge' : 'Pedagogical Goal'}
                                    </p>
                                    <p class="text-sm font-medium line-clamp-2 text-slate-700 dark:text-slate-300">${viewData.repte}</p>
                                </div>
                                
                                <div class="flex flex-wrap gap-2">
                                    <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold ${colors.bg} ${colors.text}">
                                        <i data-lucide="book-open" class="w-3.5 h-3.5"></i> Grammar Focus
                                    </span>
                                    <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300">
                                        <i data-lucide="${currentView === 'student' ? 'check-circle' : 'bar-chart'}" class="w-3.5 h-3.5"></i> ${currentView === 'student' ? viewData.products.length + ' Final Tasks' : 'Assessments'}
                                    </span>
                                </div>
                            </div>
                        </div>
                        `;
                    }).join('')}
                </div>
            `;
            lucide.createIcons();
        }

        function renderResourceCorner() {
            const section = document.getElementById('resourceSection');
            
            let content = '';
            if (currentView === 'student') {
                content = `
                    <div class="space-y-4">
                        <div class="flex items-start gap-4 p-5 rounded-2xl bg-amber-50 dark:bg-amber-900/10 border border-amber-100 dark:border-amber-900/30 transition-transform hover:-translate-y-1 hover:shadow-md">
                            <div class="mt-1 p-2 bg-amber-100 dark:bg-amber-800/50 rounded-xl text-amber-600 dark:text-amber-400"><i data-lucide="compass"></i></div>
                            <div>
                                <h4 class="font-bold text-amber-900 dark:text-amber-100">Self-Regulation</h4>
                                <p class="text-sm text-amber-800/80 dark:text-amber-200/80 mt-1">Break your tasks into smaller steps. Use a planner to map out deadlines for final products.</p>
                            </div>
                        </div>
                        <div class="flex items-start gap-4 p-5 rounded-2xl bg-blue-50 dark:bg-blue-900/10 border border-blue-100 dark:border-blue-900/30 transition-transform hover:-translate-y-1 hover:shadow-md">
                            <div class="mt-1 p-2 bg-blue-100 dark:bg-blue-800/50 rounded-xl text-blue-600 dark:text-blue-400"><i data-lucide="shield-check"></i></div>

            document.getElementById('drawerPanel').classList.add('show');
            document.getElementById('drawerContent').classList.remove('hidden');
            document.getElementById('drawerContent').classList.add('flex');
        }

        function closeDrawer() {
            document.getElementById('drawerOverlay').classList.remove('show');
            document.getElementById('drawerPanel').classList.remove('show');
            setTimeout(() => {
                document.getElementById('drawerContent').classList.add('hidden');
                document.getElementById('drawerContent').classList.remove('flex');
                selectedUnit = null;
            }, 400); // match transition duration
        }

        function switchTab(tab) {
            activeTab = tab;
            renderDrawerContent();
        }

        function toggleVocab(element) {
            const details = element.querySelector('.vocab-details');
            const icon = element.querySelector('.vocab-icon');
            if (details.classList.contains('hidden')) {
                details.classList.remove('hidden');
                icon.style.transform = 'rotate(180deg)';
            } else {
                details.classList.add('hidden');
                icon.style.transform = 'rotate(0deg)';
            }
        }

            if (!selectedUnit) return;
            const u = selectedUnit;
            const drawerContainer = document.getElementById('drawerContent');
            const viewData = currentView === 'student' ? u.student : u.teacher;
            
            // Header
            const headerHtml = `
                <div class="flex items-center gap-4">
                    <div class="w-14 h-14 rounded-2xl bg-gradient-to-br ${u.gradient} text-white flex items-center justify-center shadow-lg">

                    </div>
                    <div>
                        <p class="text-xs font-bold tracking-wider uppercase text-slate-500 dark:text-slate-400 mb-0.5">Unit ${u.id}</p>
                        <h2 class="text-2xl font-bold text-slate-900 dark:text-white leading-tight pr-4">${u.title}</h2>
                    </div>
                </div>

                <button onclick="switchTab('toolkit')" class="pb-3 pt-4 border-b-2 font-medium text-sm transition-colors whitespace-nowrap ${activeTab === 'toolkit' ? 'border-blue-500 text-blue-600 dark:text-blue-400' : 'border-transparent text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200'}">Language Toolkit</button>
                <button onclick="switchTab('assess')" class="pb-3 pt-4 border-b-2 font-medium text-sm transition-colors whitespace-nowrap ${activeTab === 'assess' ? 'border-blue-500 text-blue-600 dark:text-blue-400' : 'border-transparent text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200'}">How We Assess</button>

                            <div class="absolute -right-10 -bottom-10 opacity-20 transform -rotate-12">

                                `).join('') : ''}
